<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BIZBOY{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/usercss.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}">
</head>

<body>
    <header class="dashboard-header">
        <a href="{{ url_for('home.dashboard') }}" class="dashboard-brand">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="BIZBOY">
            <span>BIZBOY</span>
        </a>
        <nav class="dashboard-nav">
            <a href="{{ url_for('home.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('home.profile') }}">Profile</a>
        </nav>
        <button class="mobile-menu" onclick="toggleDashboardMenu()">☰</button>
    </header>
    <main class="dashboard-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-container">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer class="dashboard-footer">
        <span>BIZBOY</span>
        <span>© 2026</span>
    </footer>
    <script>
        function toggleDashboardMenu() {
            document.querySelector(".dashboard-nav").classList.toggle("mobile-open");
        }
    </script>
</body>
</html>
