{% extends "mainbase.html" %}

{% block title %}Create Account - BIZBOY{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/authcss.css') }}">
{% endblock %}

{% block content %}

<div class="auth-page">
  <div class="auth-card register-card">

    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="BIZBOY Logo">
    </div>

    <div class="auth-card-header">
      <h2>Create your BIZBOY account</h2>
      <p>Enter your details to get started.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name" required>
      </div>

      <div class="form-group">
        <label for="business_name">Business Name</label>
        <input type="text" id="business_name" name="business_name" placeholder="Enter business name"
          autocomplete="organization" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="business_type">Business Type</label>
        <select id="business_type" name="business_type">
          <option value="">Select business type</option>
          <option value="Retail">Retail</option>
          <option value="E-commerce">E-commerce</option>
          <option value="Manufacturing">Manufacturing</option>
          <option value="Food & Restaurant">Food & Restaurant</option>
          <option value="Service">Service</option>
          <option value="Technology">Technology</option>
          <option value="Education">Education</option>
          <option value="Healthcare">Healthcare</option>
          <option value="Finance">Finance</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Create a password"
            autocomplete="new-password" required>

          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">
            Show
          </button>
        </div>
      </div>

      <button type="submit" class="auth-submit">
        Create Account
      </button>

    </form>

    <div class="auth-switch">
      <span>Already have an account?</span>
      <a href="{{ url_for('auth.login') }}">Login</a>
    </div>

  </div>
</div>

<script>
  function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
      input.type = "text";
      button.textContent = "Hide";
    } else {
      input.type = "password";
      button.textContent = "Show";
    }
  }
</script>

{% endblock %}
