{% extends "mainbase.html" %}

{% block title %}Login - BIZBOY{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/authcss.css') }}">
{% endblock %}

{% block content %}

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="BIZBOY Logo">
    </div>

    <div class="auth-card-header">
      <h2>Login to BIZBOY</h2>
      <p>Access your business dashboard.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your password"
            autocomplete="current-password" required>

          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">
            Show
          </button>
        </div>
      </div>

      <button type="submit" class="auth-submit">
        Login
      </button>

    </form>

    <div class="auth-switch">
      <span>Don't have an account?</span>
      <a href="{{ url_for('auth.register') }}">Create an account</a>
    </div>

  </div>
</div>

<script>
  function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
      input.type = "text";
      button.textContent = "Hide";
    } else {
      input.type = "password";
      button.textContent = "Show";
    }
  }
</script>
{% endblock %}
